version: '3'

tasks:
  setup:
    desc: Install dependencies from the lockfile
    cmds:
      - pnpm install --frozen-lockfile

  check:
    desc: Typecheck the Astro project
    cmds:
      - pnpm check

  build:
    desc: Build the site
    cmds:
      - pnpm build

  dev:
    desc: Start the Astro dev server
    cmds:
      - pnpm dev
